# Chunked Remotion + three.js render on GitHub-hosted runners (CPU / SwiftShader).
# Start it from the Actions tab (or the GitHub app): Actions → Render video → Run workflow.
# The finished MP4 is attached to a GitHub Release named render-<composition>-<run number>.
name: Render video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: Remotion composition id (registered in video/src/Root.tsx)
        required: true
        default: Test3D
      chunks:
        description: Number of parallel chunks (runners)
        required: true
        default: "20"
      mode:
        description: "full = whole video, final quality · preview = first 10 s, shadow map 1024, MSAA off"
        type: choice
        options: [full, preview]
        default: full
      audio:
        description: Audio file to mux, relative to video/ (silent track if it does not exist)
        required: false
        default: public/audio/mix.wav
      scale:
        description: Output scale (1 = 1080x1920, 1.3333 = 2K 1440x2560)
        required: false
        default: "1"
      res:
        description: "1080 = render at the output size · 720up = render 720x1280 (WebGL buffer too), Lanczos-upscale to 1080x1920"
        type: choice
        options: ["1080", "720up"]
        default: "1080"
      stills:
        description: Frames to render as full-quality stills into the same release (comma-separated, e.g. 91,368,424)
        required: false
        default: ""
      qa_every:
        description: QA stills every N frames (15 = every 0.5 s; empty = no QA stills). Flags frames with nothing to look at.
        required: false
        default: "15"
      splice_run:
        description: "Splice: run id(s) whose chunk artifacts fill every chunk not rendered here, comma-separated, later ids win (empty = render all)"
        required: false
        default: ""
      only_chunks:
        description: "Splice: chunk indices to render (comma-separated, e.g. 2,3,22; none = only assemble); the rest come from splice_run"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: render-${{ github.ref }}-${{ inputs.composition }}-${{ inputs.mode }}-${{ inputs.res }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: video

env:
  # 720up: R3F clamps dpr >= 1, so the WebGL buffer is shrunk through the composition's "dpr" prop as well
  PROPS: ${{ inputs.res == '720up' && (inputs.mode == 'preview' && '{"preview":true,"dpr":0.666667}' || '{"dpr":0.666667}') || (inputs.mode == 'preview' && '{"preview":true}' || '{}') }}
  RSCALE: ${{ inputs.res == '720up' && '0.666667' || inputs.scale }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      frames: ${{ steps.plan.outputs.frames }}
      fps: ${{ steps.plan.outputs.fps }}
      count: ${{ steps.plan.outputs.count }}
      stills: ${{ steps.plan.outputs.stills }}
      qa: ${{ steps.plan.outputs.qa }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: deps
        uses: actions/cache@v4
        with:
          path: video/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('video/package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund && npx remotion browser ensure
      - id: kenney-cache
        uses: actions/cache/restore@v4
        with:
          path: video/public/bridge/kenney
          key: kenney-v3-${{ hashFiles('video/scripts/fetch-kenney.sh', 'video/scripts/kenney_flatten.py', 'video/assets/kenney/*.zip') }}
      - name: Kenney CC0 kits (fantasy town, nature, castle), once per run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          scripts/fetch-kenney.sh public/bridge/kenney 2>&1 | tee out/kenney-plan.txt
          exit ${PIPESTATUS[0]}
      - if: steps.kenney-cache.outputs.cache-hit != 'true' && hashFiles('video/public/bridge/kenney/.done') != ''
        uses: actions/cache/save@v4
        with:
          path: video/public/bridge/kenney
          key: kenney-v3-${{ hashFiles('video/scripts/fetch-kenney.sh', 'video/scripts/kenney_flatten.py', 'video/assets/kenney/*.zip') }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-plan
          path: video/out/kenney-plan.txt
          if-no-files-found: ignore
      - id: plan
        run: |
          out="$(node scripts/plan-chunks.mjs "${{ inputs.composition }}" "${{ inputs.chunks }}" "${{ inputs.mode }}" | tail -1)"
          echo "$out"
          only="${{ inputs.only_chunks }}"
          if [ "$only" = "none" ]; then out="$(jq -c '.matrix = []' <<<"$out")"; echo "splice: assemble only"
          elif [ -n "$only" ]; then  # splice: render only the changed chunks
            out="$(jq -c --arg o "$only" '($o | split(",") | map(gsub(" "; "") | select(length > 0) | tonumber)) as $k | .matrix |= map(select((.index | tonumber) as $i | $k | index($i)))' <<<"$out")"
            echo "splice: rendering $(jq -c '[.matrix[].index]' <<<"$out")"
          fi
          echo "matrix=$(jq -c '.matrix' <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "frames=$(jq -r '.frames' <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "fps=$(jq -r '.fps' <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq -r '.matrix | length' <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "stills=$(jq -cn --arg s '${{ inputs.stills }}' '$s | split(",") | map(gsub(" "; "")) | map(select(length > 0) | tonumber)')" >> "$GITHUB_OUTPUT"
          # QA stills: every N frames over the WHOLE video (also in preview mode), in batches of 8 (one runner each)
          n="${{ inputs.qa_every }}"; frames=$(node scripts/plan-chunks.mjs "${{ inputs.composition }}" 1 full | tail -1 | jq -r '.frames')
          if [ -n "$n" ] && [ "$n" -gt 0 ]; then
            echo "qa=$(seq 0 "$n" $((frames - 1)) | jq -cs '[range(0; length; 8) as $i | .[$i:$i+8] | map(tostring) | join(",")]')" >> "$GITHUB_OUTPUT"
          else echo "qa=[]" >> "$GITHUB_OUTPUT"; fi
      - name: Framing QA on every frame (analytic, no rendering)
        if: inputs.composition == 'EiffelShort' || inputs.composition == 'RatShort'
        run: node scripts/${{ inputs.composition == 'RatShort' && 'frame-qa-rats.mjs' || 'frame-qa.mjs' }} out/frame-qa.json | tee out/frame-qa.txt
      - if: inputs.composition == 'EiffelShort' || inputs.composition == 'RatShort'
        uses: actions/upload-artifact@v4
        with:
          name: frame-qa
          path: video/out/frame-qa.json
          retention-days: 7

  render:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: render ${{ matrix.chunk.index }} (${{ matrix.chunk.start }}-${{ matrix.chunk.end }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: deps
        uses: actions/cache@v4
        with:
          path: video/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('video/package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund && npx remotion browser ensure
      - name: Kenney kits from the cache (fetched once by the plan job; missing is allowed)
        uses: actions/cache/restore@v4
        with:
          path: video/public/bridge/kenney
          key: kenney-v3-${{ hashFiles('video/scripts/fetch-kenney.sh', 'video/scripts/kenney_flatten.py', 'video/assets/kenney/*.zip') }}
      - name: Render frames ${{ matrix.chunk.start }}-${{ matrix.chunk.end }}
        run: |
          i=${{ matrix.chunk.index }}; s0=${{ matrix.chunk.start }}; s1=${{ matrix.chunk.end }}
          mkdir -p out   # tee needs it before Remotion creates it, or the chunk log is silently lost
          t0=$(date +%s)
          # steady-state speed: time from the first finished frame to the end (startup + bundling excluded)
          ( until grep -q "Rendered 1/" "out/chunk-$i.log" 2>/dev/null; do sleep 0.5; done; date +%s > "out/first-$i" ) &
          set +e
          npx remotion render src/index.ts "${{ inputs.composition }}" "out/chunk-$i.mp4" \
            --frames=$s0-$s1 --codec h264 --crf 16 --muted \
            --gl=swangle --timeout=300000 --scale "$RSCALE" --props "$PROPS" 2>&1 | tee "out/chunk-$i.log"
          rc=${PIPESTATUS[0]}
          set -e
          t1=$(date +%s); secs=$(( t1 - t0 )); first=$(cat "out/first-$i" 2>/dev/null || echo $t0)
          steady=$(awk "BEGIN{n=$s1-$s0; printf \"%.2f\", (n > 0 ? ($t1-$first)/n : 0)}")  # parentheses: a bare > is a redirect in awk printf
          printf '{"index":"%s","start":%d,"end":%d,"seconds":%d,"steady_spf":%s,"startup":%d,"vcpu":%d,"exit":%d}\n' "$i" $s0 $s1 $secs $steady $(( first - t0 )) $(nproc) $rc > "out/chunk-$i.json"
          cat "out/chunk-$i.json"
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk.index }}
          path: video/out/chunk-${{ matrix.chunk.index }}.mp4
          retention-days: 1
          compression-level: 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.chunk.index }}
          path: |
            video/out/chunk-${{ matrix.chunk.index }}.json
            video/out/chunk-${{ matrix.chunk.index }}.log
          retention-days: 7
          if-no-files-found: ignore

  stills:
    needs: plan
    if: needs.plan.outputs.stills != '[]' && needs.plan.outputs.stills != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        frame: ${{ fromJSON(needs.plan.outputs.stills) }}
    name: still ${{ matrix.frame }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: deps
        uses: actions/cache@v4
        with:
          path: video/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('video/package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund && npx remotion browser ensure
      - uses: actions/cache/restore@v4
        with:
          path: video/public/bridge/kenney
          key: kenney-v3-${{ hashFiles('video/scripts/fetch-kenney.sh', 'video/scripts/kenney_flatten.py', 'video/assets/kenney/*.zip') }}
      - name: Still at final quality (1080x1920, MSAA 4, full shadow map)
        run: |
          f=$(printf "%05d" ${{ matrix.frame }}); mkdir -p out; t0=$(date +%s)
          npx remotion still src/index.ts "${{ inputs.composition }}" "out/still-$f.jpg" --frame=${{ matrix.frame }} \
            --gl=swangle --timeout=400000 --jpeg-quality=92 --props '{}' 2>&1 | tee "out/still-$f.log"
          echo "{\"frame\":${{ matrix.frame }},\"seconds\":$(( $(date +%s) - t0 ))}" > "out/still-$f.json"
      - uses: actions/upload-artifact@v4
        with:
          name: still-${{ matrix.frame }}
          path: |
            video/out/still-*.jpg
            video/out/still-*.json
          retention-days: 3

  qa:
    needs: plan
    if: needs.plan.outputs.qa != '[]' && needs.plan.outputs.qa != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        frames: ${{ fromJSON(needs.plan.outputs.qa) }}
    name: qa stills ${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: deps
        uses: actions/cache@v4
        with:
          path: video/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('video/package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund && npx remotion browser ensure
      - uses: actions/cache/restore@v4
        with:
          path: video/public/bridge/kenney
          key: kenney-v3-${{ hashFiles('video/scripts/fetch-kenney.sh', 'video/scripts/kenney_flatten.py', 'video/assets/kenney/*.zip') }}
      - name: QA stills (half size, probed)
        run: node scripts/render-stills.mjs "${{ inputs.composition }}" "${{ matrix.frames }}" out/qa 0.5 2>&1 | grep -E "^still |rror" || true
      - uses: actions/upload-artifact@v4
        with:
          name: qa-${{ strategy.job-index }}
          path: video/out/qa/
          retention-days: 7

  publish:
    # Runs even when chunks failed, so every run ends with a REPORT.md (run summary + release / artifact).
    needs: [plan, render, stills, qa]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMP: ${{ inputs.composition }}
      MODE: ${{ inputs.mode }}
      SCALE: ${{ inputs.scale }}
      RES: ${{ inputs.res }}
      FRAMES: ${{ needs.plan.outputs.frames }}
      FPS: ${{ needs.plan.outputs.fps }}
      CHUNKS_PLANNED: ${{ needs.plan.outputs.count }}
      RENDER_RESULT: ${{ needs.render.result == 'skipped' && 'success' || needs.render.result }}
      RUN_NUMBER: ${{ github.run_number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
      TAG: render-${{ inputs.composition }}-${{ inputs.mode }}${{ inputs.res == '720up' && '-720up' || '' }}-${{ github.run_number }}
      NAME: ${{ inputs.composition }}-${{ inputs.mode }}${{ inputs.res == '720up' && '-720up' || '' }}-run${{ github.run_number }}.mp4
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg + QA deps
        timeout-minutes: 12   # run 12: a stalled apt mirror hung this step until the 30 min job timeout
        run: |
          inst() { timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq && timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y -qq --no-install-recommends ffmpeg; }
          # the runner's Azure apt mirror stalled in runs 12 and 14: fall back to Ubuntu's main archive
          other() { sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true; inst; }
          command -v ffmpeg >/dev/null || inst || other
          ffmpeg -hide_banner -version | head -1
          timeout 300 pip install -q numpy pillow
          echo "STARTED_AT=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: log-*
          merge-multiple: true
          path: video/out/logs
      - name: Splice base (chunks of earlier runs; later run ids win)
        if: (needs.render.result == 'success' || needs.render.result == 'skipped') && inputs.splice_run != ''
        run: |
          set -euo pipefail
          mkdir -p out/chunks out/stills out/qa
          for id in $(echo "${{ inputs.splice_run }}" | tr ',' ' '); do
            for a in $(gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.expired | not) | .name' | grep -E '^(chunk|still|qa)-' || true); do
              d=$(mktemp -d); gh run download "$id" -R "${{ github.repository }}" -n "$a" -D "$d"
              case "$a" in chunk-*) cp -f "$d"/*.mp4 out/chunks/ ;; still-*) cp -f "$d"/* out/stills/ ;; qa-*) cp -rf "$d"/. out/qa/ ;; esac
            done
            echo "run $id: $(ls out/chunks | wc -l) chunks so far"
          done
      - name: This run's chunks (replace the spliced ones)
        if: needs.render.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          merge-multiple: true
          path: video/out/new-chunks
      - if: needs.render.result == 'success' || needs.render.result == 'skipped'
        run: |
          mkdir -p out/chunks && cp -f out/new-chunks/*.mp4 out/chunks/ 2>/dev/null || true
          echo "chunks: $(ls out/chunks | wc -l) total, $(ls out/new-chunks | wc -l) rendered in this run${{ inputs.splice_run != '' && format(', rest spliced from run {0}', inputs.splice_run) || '' }}"
      - uses: actions/download-artifact@v4
        with:
          pattern: still-*
          merge-multiple: true
          path: video/out/stills
      - uses: actions/download-artifact@v4
        with:
          pattern: qa-*
          merge-multiple: true
          path: video/out/qa
      - uses: actions/download-artifact@v4
        with:
          name: frame-qa
          path: video/out/fqa
        continue-on-error: true
      - name: QA sheet (stills every 0.5 s, flags)
        run: |
          ls out/qa/qa-*.json >/dev/null 2>&1 || { echo "no QA stills"; exit 0; }
          python scripts/qa-sheet.py out/qa out/qa-sheet.jpg out/QA.md out/fqa/frame-qa.json
          cat out/QA.md >> "$GITHUB_STEP_SUMMARY"
      - name: Stills contact sheet
        run: |
          ls out/stills/*.jpg >/dev/null 2>&1 || { echo "no stills"; exit 0; }
          python - <<'PY'
          import glob
          from PIL import Image, ImageDraw
          fs = sorted(glob.glob("out/stills/still-*.jpg"))
          ims = [Image.open(f).resize((360, 640), Image.LANCZOS) for f in fs]
          cols = 4; rows = (len(ims) + cols - 1) // cols
          S = Image.new("RGB", (cols * 368, rows * 648), "white"); d = ImageDraw.Draw(S)
          for k, (f, im) in enumerate(zip(fs, ims)):
              x, y = (k % cols) * 368, (k // cols) * 648; S.paste(im, (x, y))
              d.rectangle([x, y, x + 86, y + 18], fill="black"); d.text((x + 4, y + 3), "f" + f.split("-")[-1][:-4].lstrip("0"), fill="yellow")
          S.save("out/stills-sheet.jpg", quality=88)
          PY
      - name: Concatenate chunks (no re-encode) and mux audio
        if: needs.render.result == 'success' || needs.render.result == 'skipped'
        run: |
          set -euo pipefail
          cd out
          ls chunks/chunk-*.mp4 | sort | sed "s|.*|file '$PWD/&'|" > list.txt
          ffmpeg -v error -y -f concat -safe 0 -i list.txt -c copy video_only.mp4
          if [ "$RES" = "720up" ]; then  # the speed trick: 720x1280 render, Lanczos upscale to 1080x1920 (one re-encode)
            t0=$(date +%s)
            ffmpeg -v error -y -i video_only.mp4 -vf scale=1080:1920:flags=lanczos -c:v libx264 -crf 16 -preset medium -pix_fmt yuv420p video_up.mp4
            mv video_up.mp4 video_only.mp4
            echo "UPSCALE_SECS=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
          fi
          dur=$(awk "BEGIN{printf \"%.6f\", $FRAMES/$FPS}")
          audio="../${{ inputs.audio }}"
          if [ -n "${{ inputs.audio }}" ] && [ -f "$audio" ]; then
            ffmpeg -v error -y -i video_only.mp4 -i "$audio" -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 320k -t "$dur" "$NAME"
            echo "AUDIO_NOTE=${{ inputs.audio }}" >> "$GITHUB_ENV"
          else
            ffmpeg -v error -y -i video_only.mp4 -f lavfi -i anullsrc=r=48000:cl=stereo -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -t "$dur" "$NAME"
            echo "AUDIO_NOTE=silent track (no ${{ inputs.audio }} in the repo)" >> "$GITHUB_ENV"
          fi
          got=$(ffprobe -v error -count_packets -select_streams v:0 -show_entries stream=nb_read_packets -of default=nw=1:nk=1 "$NAME" | tr -cd '0-9')
          echo "frames: expected $FRAMES, got $got"
          [ "$got" = "$FRAMES" ] || { echo "::error::frame count mismatch ($got != $FRAMES)"; exit 1; }
      - name: Frame QA (skill's short_qa.py)
        if: needs.render.result == 'success' || needs.render.result == 'skipped'
        run: |
          python ../.claude/skills/claude-animated-shorts/templates/scripts/short_qa.py "out/$NAME" out/qa
          (cd out/qa && zip -q ../qa-sheets.zip sheet_*.jpg)
      - name: Write REPORT.md
        if: always()
        run: |
          k=$(cat out/logs/kenney-*.txt 2>/dev/null | grep -E "^kenney:" | sort -u | tr '\n' ';' || true)
          export KENNEY_NOTE="${k:-no log}"
          export DL_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$NAME"
          [ -f "out/$NAME" ] || { [ "$RENDER_RESULT" = success ] && export ASSEMBLY_FAILED=1; export RENDER_RESULT=failure; }
          python scripts/make-report.py out/logs out/REPORT.md "out/$NAME" out/qa/report.md
          cat out/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the MP4 as an artifact (download from the run page if the release is refused)
        if: needs.render.result == 'success' || needs.render.result == 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: VIDEO
          path: |
            video/out/${{ env.NAME }}
            video/out/qa-sheet.jpg
            video/out/stills-sheet.jpg
          retention-days: 30
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload as GitHub Release (MP4 + REPORT.md + QA sheets)
        if: needs.render.result == 'success' || needs.render.result == 'skipped'
        continue-on-error: true
        run: |
          extra=$(ls out/stills/*.jpg out/stills-sheet.jpg out/qa-sheet.jpg out/QA.md 2>/dev/null | tr '\n' ' ')
          [ -f out/QA.md ] && { echo; cat out/QA.md; } >> out/REPORT.md
          # tag the branch head (tagging an older commit was refused with 403 when the branch moved during the run);
          # the rendered commit is in REPORT.md
          gh release create "$TAG" "out/$NAME" out/REPORT.md out/qa-sheets.zip $extra --target "${GITHUB_REF_NAME}" \
            --title "$COMP ($MODE) · run ${{ github.run_number }}" --notes-file out/REPORT.md
      - name: Keep REPORT.md as an artifact (also for failed runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REPORT
          path: video/out/REPORT.md
          if-no-files-found: ignore
      - name: Fail the run if a chunk failed
        if: needs.render.result != 'success' && needs.render.result != 'skipped'
        run: exit 1
