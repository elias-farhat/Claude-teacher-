name: fetch-artifact
on:
  push:
    branches: [previews]
    paths: ["fetch.txt"]
permissions: { contents: write, actions: read }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Download artifacts listed in fetch.txt"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          while read run name; do
            [ -z "$run" ] && continue
            mkdir -p "out/$run"
            gh run download "$run" -R "${{ github.repository }}" -n "$name" -D "out/$run/$name"
          done < fetch.txt
          ls -laR out
      - name: Commit
        run: |
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add out; git commit -m "Fetched artifacts [skip ci]" || exit 0; git push -q
