name: Kokoro voice
on:
  workflow_dispatch:
    inputs:
      script: { description: "scripts/<name>", required: true, default: "moon" }
      voice: { description: "Kokoro voice", required: true, default: "am_liam" }
      speed: { description: "speed", required: true, default: "1.25" }
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          pip install kokoro-onnx soundfile
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          curl -sSL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Generate + master to -14 LUFS
        run: |
          python tools/kokoro_voice.py "${{ inputs.script }}" "${{ inputs.voice }}" "${{ inputs.speed }}"
          d=scripts/${{ inputs.script }}
          ffmpeg -v error -y -i $d/voice_raw.wav -af "aecho=0.85:0.5:30|60:0.08|0.04,loudnorm=I=-14:TP=-1.5:LRA=7" -ar 48000 -ac 1 $d/voice.wav
          ffmpeg -v error -y -i $d/voice.wav -c:a libmp3lame -b:a 192k $d/voice_preview.mp3
          rm $d/voice_raw.wav
      - name: Commit
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add scripts/${{ inputs.script }} && git commit -m "Kokoro voice for ${{ inputs.script }} (${{ inputs.voice }}, ${{ inputs.speed }}x)" && git pull --rebase && git push
