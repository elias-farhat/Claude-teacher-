name: Kokoro voice samples
on: workflow_dispatch
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          pip install kokoro-onnx soundfile
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          curl -sSL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Generate
        run: |
          mkdir -p out
          python tools/kokoro_samples.py
          for f in out/*.wav; do ffmpeg -v error -y -i "$f" -af loudnorm=I=-14:TP=-1.5 -ar 48000 -c:a libmp3lame -b:a 192k "${f%.wav}.mp3"; done
          ls -la out
      - name: Commit samples
        run: |
          mkdir -p samples/kokoro && cp out/*.mp3 samples/kokoro/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add samples/kokoro && git commit -m "Kokoro voice samples" && git pull --rebase && git push
