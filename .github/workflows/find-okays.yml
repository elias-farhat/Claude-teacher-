name: Find okays
on:
  workflow_dispatch:
    inputs:
      script: { description: "scripts/<name>", required: true, default: "moon" }
      pattern: { description: "files to scan", required: true, default: "block*.wav" }
permissions:
  contents: write
jobs:
  okays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q faster-whisper==1.1.1 requests
      - run: python tools/find_okays.py "${{ inputs.script }}" "${{ inputs.pattern }}"
      - run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add scripts/${{ inputs.script }}/capcut/*.json && git commit -m "Okay spans for ${{ inputs.script }}" && git pull --rebase && git push
