name: tts
on:
  push:
    paths: ['tts/**/lines.txt', 'tts/**/tts.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in tts/*/tts.json; do python3 tools/tts/gemini_tts.py "$(dirname "$f")"; done
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name "tts-bot"; git config user.email "tts-bot@users.noreply.github.com"
          git add tts; git commit -m "tts: audio [skip ci]" || exit 0
          git pull --rebase && git push
